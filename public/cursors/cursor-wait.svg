<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- wait: an hourglass, drawn as the stage draws everything — yellow, inked in, with
       the hard offset shadow. Two rails and a bowtie, unioned so only the silhouette
       keeps an edge. Hotspot is the middle of it (16 16). -->
  <defs>
    <g id="glass">
      <rect x="8" y="4" width="16" height="3.2" rx="1.6" />
      <rect x="8" y="24.8" width="16" height="3.2" rx="1.6" />
      <path d="M9.7 6.9 L22.3 6.9 L16.5 16 L22.3 25.1 L9.7 25.1 L15.5 16 Z" />
    </g>
  </defs>
  <use
    href="#glass"
    x="1.3"
    y="1.3"
    fill="#0c0d0a"
    stroke="#0c0d0a"
    stroke-width="1.8"
    stroke-linejoin="round"
  />
  <use href="#glass" fill="#ffd400" stroke="#0c0d0a" stroke-width="1.8" stroke-linejoin="round" />
  <use href="#glass" fill="#ffd400" />
</svg>
