<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- help: a question mark. The hook is stroked three times — the offset shadow, an ink
       casing and a yellow core — so a glyph gets the same inked edge and hard shadow as a
       filled shape. The dot follows the same casing/core. Hotspot is its middle (16 16). -->
  <defs>
    <path
      id="hook"
      fill="none"
      stroke-linecap="round"
      d="M11.4 11.5 C11.4 8.6 13.4 6.7 16.1 6.7 C18.8 6.7 20.8 8.6 20.8 11.3 C20.8 13.7 19.4 15 17.8 15.9 C16.4 16.7 16 17.3 16 17.6"
    />
  </defs>
  <g transform="translate(1.3 1.3)">
    <use href="#hook" stroke="#0c0d0a" stroke-width="6.8" />
    <circle cx="16" cy="24.4" r="2.9" fill="#0c0d0a" />
  </g>
  <use href="#hook" stroke="#0c0d0a" stroke-width="6.8" />
  <use href="#hook" stroke="#ffd400" stroke-width="3.6" />
  <circle cx="16" cy="24.4" r="2.9" fill="#0c0d0a" />
  <circle cx="16" cy="24.4" r="1.3" fill="#ffd400" />
</svg>
