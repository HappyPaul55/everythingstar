<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- grab: the open hand — four fingers, a palm and a thumb, unioned so only the
       silhouette keeps an edge, with the creases between the fingers drawn back on top
       because a union has no valleys to show where one finger ends. Hotspot is the palm
       (16 16). -->
  <defs>
    <g id="open">
      <rect x="9.1" y="6.2" width="3.7" height="12.2" rx="1.85" />
      <rect x="12.9" y="4.9" width="3.7" height="13.5" rx="1.85" />
      <rect x="16.7" y="5.4" width="3.7" height="13" rx="1.85" />
      <rect x="20.5" y="7.4" width="3.6" height="11" rx="1.8" />
      <rect x="8.9" y="15.6" width="15.6" height="12.4" rx="5.6" />
      <rect
        x="-4.8"
        y="-2.6"
        width="9.6"
        height="5.2"
        rx="2.6"
        transform="translate(8.4 21.4) rotate(-19)"
      />
    </g>
  </defs>
  <use
    href="#open"
    x="1.3"
    y="1.3"
    fill="#0c0d0a"
    stroke="#0c0d0a"
    stroke-width="1.8"
    stroke-linejoin="round"
  />
  <use href="#open" fill="#ffd400" stroke="#0c0d0a" stroke-width="1.8" stroke-linejoin="round" />
  <use href="#open" fill="#ffd400" />
  <g fill="none" stroke="#0c0d0a" stroke-width="1.7" stroke-linecap="round">
    <path d="M12.85 7.2 V16.2" />
    <path d="M16.65 6.2 V16.2" />
    <path d="M20.45 8.4 V16.2" />
  </g>
</svg>
