    <path id="beam" fill="none" stroke-linecap="round" d="M9.6 6.8 H22.4 M16 6.8 V25.2 M9.6 25.2 H22.4" />
  </defs>
  <use href="#beam" x="1.3" y="1.3" stroke="#0c0d0a" stroke-width="6.8" />
  <use href="#beam" stroke="#0c0d0a" stroke-width="6.8" />
  <use href="#beam" stroke="#ffd400" stroke-width="3.6" />
</svg>
