<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- not-allowed: the no-entry ring and its bar, in the one colour the palette keeps
       for "no" (the danger red, the dropped note) rather than the yellow the rest of the
       set is built from. Hotspot is its middle (16 16). -->
  <defs>
    <g id="no">
      <circle cx="16" cy="16" r="10.2" />
      <path d="M9.4 9.4 L22.6 22.6" />
    </g>
  </defs>
  <use
    href="#no"
    x="1.3"
    y="1.3"
    fill="none"
    stroke="#0c0d0a"
    stroke-width="6.8"
    stroke-linecap="round"
  />
  <use href="#no" fill="none" stroke="#0c0d0a" stroke-width="6.8" stroke-linecap="round" />
  <use href="#no" fill="none" stroke="#ff4d4f" stroke-width="3.6" stroke-linecap="round" />
</svg>
