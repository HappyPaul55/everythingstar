<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>EverythingStar — social card</title>
    <style>
      /*
       * One source layout, three social sizes. The card fills the viewport and
       * every size is stated against a 630px-tall reference (1rem = 10px there,
       * so the numbers below read in the same units the design was drawn in),
       * which is what lets the 1200×630 Open Graph card and the 1280×640 GitHub
       * social preview come out of this one file. Render it with
       * `bun run cards` rather than opening it and taking a screenshot by hand.
       */
      @font-face {
        font-family: "Permanent Marker";
        font-weight: 400;
        src: url("../public/fonts/permanent-marker-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Space Grotesk";
        font-weight: 300 700;
        src: url("../public/fonts/space-grotesk-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Space Mono";
        font-weight: 700;
        src: url("../public/fonts/space-mono-latin-700.woff2") format("woff2");
      }

      * {
        margin: 0;
        box-sizing: border-box;
      }
      html {
        /* 630px ÷ 63 = 10px, the reference the sizes below were drawn at. */
        font-size: calc(100vh / 63);
      }
      html,
      body {
        width: 100%;
        height: 100%;
      }
      body {
        position: relative;
        overflow: hidden;
        background-color: #0c0d0a;
        background-image:
          radial-gradient(rgba(255, 212, 0, 0.1) 1px, transparent 1.5px),
          radial-gradient(rgba(250, 250, 244, 0.06) 1px, transparent 1.5px);
        background-size: 22px 22px, 13px 13px;
        background-position: 0 0, 7px 8px;
        color: #fbfbf3;
        font-family: "Space Grotesk", sans-serif;
        display: flex;
        flex-direction: column;
      }
      .hazard {
        height: 1.4rem;
        background-image: repeating-linear-gradient(
          -45deg,
          #ffd400 0 22px,
          #0c0d0a 22px 44px
        );
      }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 6.4rem;
        padding: 0 8rem;
      }
      .mark {
        flex: none;
        width: 20rem;
        height: 20rem;
        /* 14/64, the same proportion as public/icons/brand-mark.svg's tile. */
        border-radius: 4.4rem;
        background: #ffd400;
        display: grid;
        place-items: center;
        box-shadow: 1.4rem 1.4rem 0 0 rgba(250, 250, 244, 0.14);
      }
      .mark svg {
        width: 20rem;
        height: 20rem;
      }
      .tag {
        font-family: "Space Mono", monospace;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        font-size: 2rem;
        color: #ffd400;
      }
      h1 {
        font-family: "Permanent Marker", sans-serif;
        font-weight: 400;
        font-size: 10.8rem;
        line-height: 1;
        margin-top: 0.6rem;
      }
      p {
        margin-top: 2.6rem;
        max-width: 64rem;
        font-size: 3rem;
        line-height: 1.35;
        color: rgba(250, 250, 244, 0.74);
      }
      .chips {
        margin-top: 3.4rem;
        display: flex;
        gap: 1.4rem;
        font-family: "Space Mono", monospace;
        font-weight: 700;
        font-size: 1.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .chip {
        padding: 1rem 2rem;
        border: 2px solid rgba(250, 250, 244, 0.3);
        border-radius: 999px;
        color: rgba(250, 250, 244, 0.72);
      }
      /* Only the words' place wears the accent: every other way to play is default. */
      .chip--vocals {
        border-color: #22e0ff;
        color: #22e0ff;
      }
    </style>
  </head>
  <body>
    <div class="hazard"></div>
    <main>
      <div class="mark">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <clipPath id="half">
              <rect x="0" y="0" width="44" height="64" />
            </clipPath>
          </defs>
          <text
            x="20"
            y="44"
            text-anchor="middle"
            fill="#0C0D0A"
            font-family="'Permanent Marker', sans-serif"
            font-size="30"
          >E</text>
          <path
            d="M44 23 L46.704 29.279 L53.511 29.910 L48.375 34.421 L49.878 41.090 L44 37.6 L38.122 41.090 L39.625 34.421 L34.489 29.910 L41.296 29.279 Z"
            fill="none"
            stroke="#0C0D0A"
            stroke-width="2"
            stroke-linejoin="round"
          />
          <path
            d="M44 23 L46.704 29.279 L53.511 29.910 L48.375 34.421 L49.878 41.090 L44 37.6 L38.122 41.090 L39.625 34.421 L34.489 29.910 L41.296 29.279 Z"
            fill="#0C0D0A"
            clip-path="url(#half)"
          />
        </svg>
      </div>
      <div>
        <div class="tag">// one stage, three ways to play</div>
        <h1>EverythingStar</h1>
        <p>Guitar, bass, keys and drums, the lyrics typed on a keyboard, and karaoke — three ways to play in your browser.</p>
        <div class="chips">
          <span class="chip">Instruments</span>
          <span class="chip">Typing</span>
          <span class="chip chip--vocals">Karaoke</span>
        </div>
      </div>
    </main>
    <div class="hazard"></div>
  </body>
</html>
