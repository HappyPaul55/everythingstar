# The manual deploy: rollback and an explicit redeploy.
#
# The automatic deploy is the `deploy` job in ci.yml: it runs only after `verify`
# and `e2e` have passed on `main`, and it consumes the `site-dist` artifact that
# the package job built. This workflow is the path with no CI artifact to consume: it
# builds and verifies the checkout it is given, then deploys that `dist/`.
#
# Two things live outside this file. The repository secrets are
# `CLOUDFLARE_API_TOKEN` (Workers Scripts: Edit) and `CLOUDFLARE_ACCOUNT_ID`. And
# Workers Builds must be disconnected in the Cloudflare dashboard: otherwise it
# builds and deploys the same commit a second time.
#
# The `environment` below is what creates the GitHub Deployment entry, and the
# smoke test at the end is what proves the live site is serving this commit's
# build.
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: https://everythingstar.happypaul55.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # setup-bun reads the Bun version from package.json's `packageManager`.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      # `bun run verify` captures the documentation screenshots with Playwright,
      # so the browser has to be installed before the build starts.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      # A manual deploy has no CI artifact, so it builds and verifies this
      # checkout. It deploys exactly what `verify` produced.
      - run: bun run verify
      - name: Deploy to Cloudflare
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke-test production
        # The build identity is the point: this checkout built `dist/`, and the
        # origin serves those files, so `/sw.js` must name this checkout's
        # version.
        run: bun scripts/smoke.ts --base https://everythingstar.happypaul55.com --expect "$(bun scripts/version.ts)"
