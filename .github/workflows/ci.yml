name: CI

# Read-only in every job: nothing here writes to the repository. `review` asks for the
# one extra permission it needs, and nothing else does.
permissions:
  contents: read

# A superseded pull-request run is cancelled. Every push to `main` gets a group of
# its own (the commit): a shared group keeps only **one** pending run, so a third
# quick merge would cancel the second and leave that commit with no deployment
# record or smoke test. A push is never cancelled in progress.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Build first, with no captures on disk. The documentation plugin still writes the
  # `<img>` tags for every promised variant; the e2e shards fill the files and the
  # package job joins them to this build. Keeping the capture run out of the build
  # is what makes the two layers independent.
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      # No docs captures yet: the build writes the image tags for them. The PWA
      # test belongs to the package job, where the build and its images meet.
      - run: bun run build:quick
      - name: Keep the build for the package job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-build
          path: dist/
          if-no-files-found: error
          # `dist/.well-known/assetlinks.json` is a hidden path, and the PWA
          # check fails without it.
          include-hidden-files: true
      # The installed game needs a browser, and this job already has the build.
      # Running it here keeps it off the package job's tail and in parallel with
      # the browser jobs; the package job then only merges and checks.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Test the installed game against the build
        run: bun run test:pwa
        env:
          PLAYWRIGHT_PWA_BUILT: "1"

  # The cheap checks need the build only as a sequencing point; they do not read
  # its files. Keeping them separate means a type or unit failure is reported while
  # the browser suite is still running.
  unit:
    name: unit
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run knip
      - run: bun run check
      - run: bun run typecheck:tests
      - run: bun test

  # Three behavioural shards and two capture jobs, deliberately named rather than
  # left to Playwright's index split. The suite used to divide itself into two
  # behavioural shards and two capture shards by accident; the shard that received
  # the two long files (`a11y`, `loop`) was the 194 s tail while the other ran 126 s.
  # The captures are one project each, so a desktop failure cannot take the mobile
  # run with it. In total this is five runners, under the nine a single run may use.
  browser:
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: behaviour 1/3
            key: behaviour-1
            project: chromium
            shard: 1/3
            docshots: "false"
          - name: behaviour 2/3
            key: behaviour-2
            project: chromium
            shard: 2/3
            docshots: "false"
          - name: behaviour 3/3
            key: behaviour-3
            project: chromium
            shard: 3/3
            docshots: "false"
          - name: captures desktop
            key: captures-desktop
            project: desktop
            shard: 1/1
            docshots: "true"
          - name: captures mobile
            key: captures-mobile
            project: mobile
            shard: 1/1
            docshots: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      # Vite's dependency prebundle is the first-page transform cost; it depends on
      # the lockfile, not on the commit, so every shard on a branch can share it.
      - name: Cache the dev prebundle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules/.vite
          key: ${{ runner.os }}-vite-${{ hashFiles('bun.lock') }}
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      # The dev server has no service worker to intercept the routes the specs
      # answer, so neither job needs a built site; the build that names the capture
      # images is the package job's, not this suite's target.
      - run: bun run test:e2e --project=${{ matrix.project }} --shard=${{ matrix.shard }}
      # The capture jobs are the other half of the build. Their two sets are kept
      # apart and the package job merges them.
      - name: Upload the documentation captures
        if: always() && matrix.docshots == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doc-shots-${{ matrix.key }}
          path: public/docs/test-output/
          if-no-files-found: ignore
      - name: Upload the Playwright results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results-${{ matrix.key }}
          path: test-results/
          if-no-files-found: ignore

  # The two halves meet here: the build that names the images, and the captures
  # the browser shards made. `docs:bundle` copies the WebPs into the built site,
  # and `check:docs` refuses to pass if a named image is absent.
  package:
    name: package
    needs: [build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-build
          path: dist
      - name: Download the captures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: doc-shots-*
          path: public/docs/test-output
          merge-multiple: true
      - run: bun run docs:bundle
      - run: bun run check:docs
      - run: bun run check:pwa
      - run: bun run budget
      - run: bun run release:assets
      - run: bun run check:release
      - name: Keep the packaged site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: dist/
          if-no-files-found: error
          include-hidden-files: true

  # The required `verify` check is this aggregate, not the package job's name:
  # the ruleset keeps one stable check while the jobs beneath it change.
  verify:
    name: verify
    needs: [unit, package, workflows, review]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the gates that must pass
        run: |
          if [ "${{ needs.unit.result }}" != "success" ] || [ "${{ needs.package.result }}" != "success" ]; then
            echo "unit=${{ needs.unit.result }} package=${{ needs.package.result }}"
            exit 1
          fi
          if [ "${{ needs.workflows.result }}" != "success" ]; then
            echo "workflows=${{ needs.workflows.result }}"
            exit 1
          fi
          # The security review is a pull-request job: skipped on main is fine,
          # anything else is not.
          case "${{ needs.review.result }}" in
            success | skipped) ;;
            *)
              echo "review=${{ needs.review.result }}"
              exit 1
              ;;
          esac

  # The required `e2e` check is this aggregate, not the matrix job's own name.
  e2e:
    name: e2e
    needs: browser
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every browser shard
        run: |
          if [ "${{ needs.browser.result }}" != "success" ]; then
            echo "browser=${{ needs.browser.result }}"
            exit 1
          fi

  # The deploy is the last job in the same run, so the artifact it consumes is
  # the one this workflow built and checked. A manual dispatch of deploy.yml
  # remains the rollback path, where there is no CI artifact to consume.
  #
  # `always()` is deliberate: `verify` needs the pull-request-only `review` job,
  # which is *skipped* on `main`, and a job that needs a job whose own dependency
  # was skipped does not run on its plain `if:` — the deploy was silently skipped
  # once the aggregate gained that dependency. The result checks below gate it.
  deploy:
    name: deploy
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.verify.result == 'success' &&
      needs.e2e.result == 'success'
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://everythingstar.happypaul55.com
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Download the packaged site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: dist
      - name: Deploy to Cloudflare
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke-test production
        run: bun scripts/smoke.ts --base https://everythingstar.happypaul55.com --expect "$(bun scripts/version.ts)"

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The linter is a container, not an action: an unpinned `uses:` would be the
      # very thing this job is here to catch. The tag is the version.
      - name: Lint the workflow files
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12

  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A dependency that arrives with a known vulnerability stops here, which is
      # CONTRIBUTING's "no new runtime dependency without a reason" with data behind it.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
