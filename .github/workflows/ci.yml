name: CI

# Read-only in every job: nothing here writes to the repository. `review` asks for the
# one extra permission it needs, and nothing else does.
permissions:
  contents: read

# A superseded pull-request run is cancelled. A push to `main` is not, because that
# commit is the one the deployment record and its smoke test point at.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # The gate is about a minute of install and four of checks; the documentation
    # captures add five minutes of browser. Anything near these limits is a hung
    # runner, not a slow test.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # setup-bun reads the Bun version from package.json's `packageManager`.
      # The scripts run Astro on Bun's own runtime (`bun --bun astro …`), so the
      # runner image's Node is never the version Astro checks itself against.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # Bun's own download cache, keyed on the lockfile: without it both jobs fetch
      # the same tree from the registry on every push.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      # The gate builds, and the build captures the documentation screenshots with
      # Playwright: the browser must be here before `verify`, not only in `e2e`.
      # The browser build is pinned by @playwright/test in bun.lock; cache the
      # download, not the system libraries. `--with-deps` installs those.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - run: bun run verify

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      # The browser build is pinned by @playwright/test in bun.lock; cache the
      # download, not the system libraries. `--with-deps` installs those.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      # The specs start their own dev server (playwright.config.ts), so this job
      # needs no separate build step.
      - run: bun run test:e2e
      # The offline half needs a production build and `astro preview`; that config
      # builds inside its own webServer.
      - run: bun run test:pwa
      # The whole directory: both JUnit reports and, when a test fails, the traces
      # and screenshots each config keeps in its own output directory.
      - name: Upload the Playwright results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The linter is a container, not an action: an unpinned `uses:` would be the
      # very thing this job is here to catch. The tag is the version.
      - name: Lint the workflow files
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12

  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A dependency that arrives with a known vulnerability stops here, which is
      # CONTRIBUTING's "no new runtime dependency without a reason" with data behind it.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
