# A release is a checkpoint that carries the build's own output.
#
# A `v*` tag is cut by hand on a commit that has already passed CI on protected
# `main`, so this workflow does not repeat the gates. It does build, because a tag
# has no other way to get the artifacts: the Release attaches **three views of one
# `dist/`** — `game`, `arcade` and `website`, each as a zip and a tar.gz — and they
# only exist once the site is built. The tagged commit is `main`'s, where
# `bun run verify` already built and checked the same archives, so the build here
# is a rebuild of a commit that was already verified rather than a new gate.
#
# The archives are reproducible (sorted entries, the commit's timestamp, no extra
# attributes), so rebuilding the same commit gives the same bytes.
#
# The tag must equal `package.json`'s version, so the version the game shows,
# the tag and the release cannot disagree — `package.json` is the one place the
# version is written. A tag whose commit is not on `main` is refused, so a stray
# branch cannot invent a release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The ancestry question is asked of the API rather than of the local clone,
      # because a tag checkout is shallow and `merge-base` would answer from a
      # history that is not all there. `main...<sha>`: "identical" is the tag on
      # main, "behind" is main since moved past it, "ahead" or "diverged" is a
      # commit main has never had.
      - name: The tag is the version, and it is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(jq -r .version package.json)"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json $pkg" >&2
            exit 1
          fi
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)"
          case "$status" in
            identical | behind) ;;
            *)
              echo "tag commit $GITHUB_SHA is not on main (compare: $status)" >&2
              exit 1
              ;;
          esac
      # setup-bun reads the Bun version from package.json's `packageManager`, and
      # the build scripts run Astro on Bun's own runtime (`bun --bun astro …`).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      # `dist/`, then `dist/sw.js`, then the three archives in `release/`.
      - run: bun run build
      - run: bun run release:assets
      # The same gate CI runs: each archive holds its plan, its page names nothing
      # it has not got, and the zip and the tar.gz agree.
      - run: bun run check:release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/game.zip \
            release/game.tar.gz \
            release/arcade.zip \
            release/arcade.tar.gz \
            release/website.zip \
            release/website.tar.gz \
            --title "EverythingStar $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            --latest
