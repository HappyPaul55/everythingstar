# A release is a checkpoint that carries the build's own output.
#
# There are two ways in:
#
# - **A version change on `main`.** When a pull request changes `package.json`'s
#   version and its CI run on `main` succeeds, this workflow tags that commit and
#   publishes the release. Nothing else is needed: the release is the first CI
#   run after the bump, and a merge that does not change the version is a no-op.
# - **A `v*` tag pushed by hand.** The tag must equal `package.json`'s version and
#   be on `main`; a stray tag is refused. This stays for a backfill or a re-run.
#
# It does build, because a release has no other way to get the artifacts: the
# Release attaches **three views of one `dist/`** — `game`, `arcade` and
# `website`, each as a zip and a tar.gz — plus the printable `guide.pdf`, and
# they only exist once the site is built. The commit is `main`'s, where
# `bun run verify` already built and checked the same archives, so the build here
# is a rebuild of a commit that was already verified rather than a new gate.
#
# The archive step is deterministic (sorted entries, the commit's timestamp, no
# extra attributes), so the same `dist/` produces the same bytes. The build is not:
# Astro stamps per-build ids into the pages and the worker names its build time, so
# a rebuild of the same commit has the same file names and chunks, not the same bytes.
#
# The tag must equal `package.json`'s version, so the version the game shows,
# the tag and the release cannot disagree — `package.json` is the one place the
# version is written. A tag whose commit is not on `main` is refused, so a stray
# branch cannot invent a release.
name: Release

on:
  push:
    tags: ["v*"]
  # The version bump is a normal pull request. This is how its merge reaches the
  # release: CI runs on `main`, and the release reads the version that passed.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

# One release at a time. The version job of a second run sees the first release
# and does nothing, and a tag and a CI completion cannot race each other.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The cheap half: read the version, decide whether it already has a release,
  # and say which commit the build should use. Most merges stop here.
  version:
    # A tag push always looks; a CI completion only when that run passed and was
    # a push to main, so a red build never publishes.
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      ref: ${{ steps.release.outputs.ref }}
      create_tag: ${{ steps.release.outputs.create_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A CI completion names the `main` commit whose checks passed; a tag
          # push is already checked out at its tag.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0
          fetch-tags: true
      - name: Decide whether this commit is a release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"
          tag="v$version"
          {
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

          # A published release is the one thing this must never repeat. Tags are
          # immutable, so a version is released once; every later merge is a no-op.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already published; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # A hand-pushed tag: the tag is the version, and the tag is on main.
            # `main...<sha>` answers "identical" for the tag's own commit and
            # "behind" once main has moved on; anything else is not main's.
            if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "tag $GITHUB_REF_NAME does not match package.json $version" >&2
              exit 1
            fi
            status="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)"
            case "$status" in
              identical | behind) ;;
              *)
                echo "tag commit $GITHUB_SHA is not on main (compare: $status)" >&2
                exit 1
                ;;
            esac
            ref="refs/tags/$tag"
          else
            # A CI completion on main. The version is package.json's, so this is
            # a release exactly when the version is one that has no release yet.
            sha="${{ github.event.workflow_run.head_sha }}"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              # The tag exists but the release did not: a previous publish failed
              # after tagging. Build that tag rather than main's later head.
              ref="refs/tags/$tag"
              echo "$tag already exists at $(git rev-list -n1 "$tag"); publishing that commit."
            else
              ref="$sha"
              echo "publishing $tag at $sha."
              echo "create_tag=true" >> "$GITHUB_OUTPUT"
            fi
          fi

          {
            echo "ref=$ref"
            echo "publish=true"
          } >> "$GITHUB_OUTPUT"
  publish:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.ref }}
          fetch-depth: 0
          fetch-tags: true
      - name: The checkout is the version being released
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          pkg="$(jq -r .version package.json)"
          if [ "$pkg" != "$VERSION" ]; then
            echo "package.json is $pkg, but this release is for $VERSION" >&2
            exit 1
          fi
      # setup-bun reads the Bun version from package.json's `packageManager`, and
      # the build scripts run Astro on Bun's own runtime (`bun --bun astro …`).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      # `bun run build` starts with `docs:shots`, which drives Playwright. A Bun
      # install does not fetch a browser, so without this the release died before
      # it wrote a single archive.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      # `dist/`, then `dist/sw.js`, then the printable guide in `release/`, then the
      # three archives beside it.
      - run: bun run build
      - run: bun run guide:pdf
      - run: bun run release:assets
      # The same gate CI runs: each archive holds its plan, its page names nothing
      # it has not got, and the zip and the tar.gz agree.
      - run: bun run check:release
      # The tag is made only once the artifacts are built and checked, so a failed
      # build leaves no tag. A retry of the same workflow finds the tag (if the
      # failure came later) and publishes the commit it points at.
      - name: Tag the release
        if: needs.version.outputs.create_tag == 'true'
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "EverythingStar $TAG"
          git push origin "$TAG"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            release/game.zip \
            release/game.tar.gz \
            release/arcade.zip \
            release/arcade.tar.gz \
            release/website.zip \
            release/website.tar.gz \
            release/guide.pdf \
            --title "EverythingStar $TAG" \
            --generate-notes \
            --verify-tag \
            --latest
