# The live site, checked when it is not deploying.
#
# `deploy.yml` verifies production the moment a merge reaches it, and never again.
# Everything that can go wrong afterwards is invisible to it: a header edited in the
# Cloudflare dashboard, an expired certificate, an outage, a build promoted from a
# branch, a service worker that stops answering. This job asks the same questions on
# a schedule — the same `scripts/smoke.ts`, the same origin — and one of its own.
#
# The one of its own is the build: not "is this the head?" — a deploy in flight is
# not a fault, and Cloudflare can take as long as it likes — but "is what production
# serves a commit from `main`?". That is false for a build promoted from a branch, or
# for one left behind by a deploy that never landed.
#
# It runs at 06:17 UTC: away from the top of the hour, where GitHub's scheduler is
# busiest, and outside the working day. A failure notifies whoever last touched this
# file, which is the only person who can act on it.
name: Production check

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-check
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # No `bun install`: the smoke test imports nothing.
      - name: Check the site
        run: bun scripts/smoke.ts --base https://everythingstar.happypaul55.com
      - name: Is production serving a build from main?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          live="$(bun scripts/smoke.ts --live)"
          echo "production is serving $live"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/${live##*+}" --jq .sha)"
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$sha" --jq .status)"
          case "$status" in
            identical | behind) echo "on main" ;;
            *)
              echo "::error::production is serving $live, which is not on main ($status)"
              exit 1
              ;;
          esac
