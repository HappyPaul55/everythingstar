# The live site, checked when it is not deploying.
#
# `deploy.yml` verifies production the moment a merge reaches it, and never again.
# Everything that can go wrong afterwards is invisible to it: a header edited in the
# Cloudflare dashboard, an expired certificate, an outage, a deploy from outside the
# pipeline, a service worker that stops answering. This job asks the same questions
# on a schedule — the same `scripts/smoke.ts`, the same origin — and expects the
# build `main` points at.
#
# It runs at 06:17 UTC: away from the top of the hour, where GitHub's scheduler is
# busiest, and outside the working day. A failure notifies whoever last touched this
# file, which is the only person who can act on it.
#
# A merge that lands while the check is running is not a false alarm worth designing
# for twice: the identity is retried for ninety seconds, and a re-run from the
# Actions tab is one press.
name: Production check

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-check
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # The branch head, not the checkout: a scheduled run can start a little after
      # the commit it was queued for, and production follows `main`. The version
      # itself comes from `scripts/version.ts`, so the format has one home.
      - name: The version production should be serving
        id: expect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          echo "version=$(GITHUB_SHA="$head" bun scripts/version.ts)" >> "$GITHUB_OUTPUT"
      # No `bun install`: the smoke test imports nothing.
      - name: Check production
        run: bun scripts/smoke.ts --base https://everythingstar.happypaul55.com --expect "${{ steps.expect.outputs.version }}"
